[workspace]
resolver = "2"
members = [
    "crates/*",
    "examples/*",
    "examples/benchmarks/cybercab",
]
# The Elixir counterparts of the examples are Mix projects, and `shared` holds data both
# use.
exclude = ["examples/elixir", "examples/shared", "examples/benchmarks"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
rust-version = "1.90"

[workspace.dependencies]
uuid = { version = "1", features = ["v4", "serde"] }
