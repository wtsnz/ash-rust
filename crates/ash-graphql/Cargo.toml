[package]
name = "ash-graphql"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Automatic GraphQL server engine for ash-rust powered by async-graphql"

[dependencies]
ash-core = { path = "../ash-core" }
ash-pubsub = { path = "../ash-pubsub" }
async-graphql = { version = "7", features = ["dynamic-schema", "dataloader"] }
async-stream = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt"] }
uuid.workspace = true
axum = { version = "0.8", optional = true }
async-graphql-axum = { version = "7", optional = true }

[features]
default = []
axum = ["dep:axum", "dep:async-graphql-axum"]

[dev-dependencies]
ash-macros = { path = "../ash-macros" }
ash-memory = { path = "../ash-memory" }
ash-sqlite = { path = "../ash-sqlite" }
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[[example]]
name = "web_dashboard"
required-features = ["axum"]
