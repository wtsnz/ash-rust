[package]
name = "ash-authentication"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Declarative authentication engine for ash-rust"

[dependencies]
ash-core = { path = "../ash-core" }
ash-memory = { path = "../ash-memory" }
ash-authentication-macros = { path = "../ash-authentication-macros" }
argon2 = { version = "0.6", features = ["alloc", "password-hash", "getrandom"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
sha2 = "0.10"
hex = "0.4"
subtle = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid.workspace = true
tokio = { version = "1", features = ["sync", "time"] }
axum = { version = "0.8", optional = true }

[features]
default = []
axum = ["dep:axum"]

[dev-dependencies]
ash-macros = { path = "../ash-macros" }
ash-memory = { path = "../ash-memory" }
ash-sqlite = { path = "../ash-sqlite" }
axum = "0.8"
bytes = "1"
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[[example]]
name = "auth_server"
required-features = ["axum"]
