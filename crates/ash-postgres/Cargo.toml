[package]
name = "ash-postgres"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "PostgreSQL data layer for ash-rust, on tokio-postgres"

[dependencies]
ash-core = { path = "../ash-core" }
ash-sql = { path = "../ash-sql" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
deadpool-postgres = "0.14"
rust_decimal = { version = "1", default-features = false, features = ["std", "db-tokio-postgres"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
uuid.workspace = true

[dev-dependencies]
ash-macros = { path = "../ash-macros" }
ash-memory = { path = "../ash-memory" }
ash-sqlite = { path = "../ash-sqlite" }
criterion = { version = "0.5", features = ["async_tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "bench_postgres"

[[bench]]
name = "postgres_bench"
harness = false
