[package]
name = "ash-mailer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Declarative transactional mailer, email notifier, and auth sender for ash-rust"

[dependencies]
ash-core = { path = "../ash-core" }
ash-authentication = { path = "../ash-authentication", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
uuid.workspace = true

[features]
default = ["auth"]
auth = ["dep:ash-authentication"]

[dev-dependencies]
ash-macros = { path = "../ash-macros" }
ash-memory = { path = "../ash-memory" }
ash-sqlite = { path = "../ash-sqlite" }
ash-authentication = { path = "../ash-authentication" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
