[package]
name = "cargo-ash"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Declarative schema migrations and CLI tooling for ash-rust"

[[bin]]
name = "cargo-ash"
path = "src/main.rs"

[dependencies]
ash-core = { path = "../ash-core" }
ash-sql = { path = "../ash-sql", features = ["sqlite", "postgres"] }
ash-sqlite = { path = "../ash-sqlite" }
ash-postgres = { path = "../ash-postgres" }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "postgres",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid.workspace = true
