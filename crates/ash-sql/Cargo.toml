[package]
name = "ash-sql"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Shared relational query compiler, dialect abstraction, and declarative migration engine for ash-rust"

[dependencies]
ash-core = { path = "../ash-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
uuid.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio"], optional = true }

[features]
default = []
sqlx = ["dep:sqlx"]
sqlite = ["sqlx", "sqlx/sqlite"]
postgres = ["sqlx", "sqlx/postgres"]

[dev-dependencies]
ash-macros = { path = "../ash-macros" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
