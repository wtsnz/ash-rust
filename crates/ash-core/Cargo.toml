[package]
name = "ash-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Typed actions, resources, and policies"

[dependencies]
ash-macros = { path = "../ash-macros" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid.workspace = true

[dev-dependencies]
ash-memory = { path = "../ash-memory" }
ash-pubsub = { path = "../ash-pubsub" }
ash-sqlite = { path = "../ash-sqlite" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
