[package]
name = "helpdesk"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Helpdesk spike on ash-core"

[dependencies]
ash-core = { path = "../../crates/ash-core" }
ash-memory = { path = "../../crates/ash-memory" }
ash-sqlite = { path = "../../crates/ash-sqlite" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "helpdesk_bench"
harness = false
