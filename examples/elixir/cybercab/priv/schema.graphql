type Cab {
  id: ID!
  callSign: String!
  nickname: String!
  vin: String!
  software: String!
  lng: Float!
  lat: Float!
  headingDeg: Int!
  speedKph: Int!
  batteryPct: Int!
  rangeKm: Int!
  odometerKm: Float!
  cabinTempC: Float!
  halted: Boolean!
  lastSeenAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
  status: String!
  depotId: ID!
  tripId: ID
  depot: Depot!
  trip: Trip
  trips(
    "How to sort the records in the response"
    sort: [TripSortInput]

    "A filter to limit the results"
    filter: TripFilterInput

    "The number of records to return."
    limit: Int

    "The number of records to skip."
    offset: Int
  ): [Trip!]!
  tripsCompleted: Int!
  faresCents: Int
}

