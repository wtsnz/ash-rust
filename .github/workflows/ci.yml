name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.90.0

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector/pgvector is Postgres 16 with the vector extension available.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ash_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ash_test
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g typescript@5
      - uses: oven-sh/setup-bun@v2
      - name: Install astro-helpdesk frontend deps
        working-directory: examples/astro-helpdesk/frontend
        run: bun install --frozen-lockfile
      - name: Install cybercab frontend deps
        working-directory: examples/cybercab/frontend
        run: bun install --frozen-lockfile
      - run: cargo test --locked --all

  # The Elixir twins of the examples (examples/elixir): each is the same app on Ash for Elixir,
  # kept in step with its Rust example.
  elixir:
    name: Elixir (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [helpdesk, kanban, astro-helpdesk]
    defaults:
      run:
        working-directory: examples/elixir/${{ matrix.project }}
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"
          version-type: loose
      - uses: actions/cache@v4
        with:
          path: |
            examples/elixir/${{ matrix.project }}/deps
            examples/elixir/${{ matrix.project }}/_build
          key: elixir-${{ matrix.project }}-${{ runner.os }}-${{ hashFiles(format('examples/elixir/{0}/mix.lock', matrix.project)) }}
          restore-keys: elixir-${{ matrix.project }}-${{ runner.os }}-
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
      - name: GraphQL schema is up to date
        if: matrix.project == 'astro-helpdesk'
        run: |
          mix absinthe.schema.sdl --schema AstroHelpdesk.Schema priv/schema.graphql
          git diff --exit-code priv/schema.graphql

  # The two twins with no tests of their own (they're checked by their parity and benchmark
  # drivers, which need Postgres and both servers) must at least build.
  elixir-build:
    name: Elixir build (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [cybercab, supportdesk]
    defaults:
      run:
        working-directory: examples/elixir/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"
          version-type: loose
      - uses: actions/cache@v4
        with:
          path: |
            examples/elixir/${{ matrix.project }}/deps
            examples/elixir/${{ matrix.project }}/_build
          key: elixir-${{ matrix.project }}-${{ runner.os }}-${{ hashFiles(format('examples/elixir/{0}/mix.lock', matrix.project)) }}
          restore-keys: elixir-${{ matrix.project }}-${{ runner.os }}-
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
