name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.90.0

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `-D warnings` would also fail on the DSL's intentional `__ash_lint` deprecation notes.
      - run: cargo clippy --locked --all-targets --all-features -- -D clippy::all

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ash_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ash_test
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g typescript@5
      - uses: oven-sh/setup-bun@v2
      - name: Install astro-helpdesk frontend deps
        working-directory: examples/astro-helpdesk/frontend
        run: bun install --frozen-lockfile
      - run: cargo test --locked --all
